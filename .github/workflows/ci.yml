name: CI - Event Streaming Lab

# 특정 브랜치에 푸시되거나 PR이 생성될 때 워크플로우 트리거
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # 최신 우분투 환경에서 실행
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - uses: actions/checkout@v4

      # 2. Java 21 환경 세팅 (Temurin 배포판)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle # Gradle 의존성 캐싱으로 빌드 속도 향상

      # 3. Gradle 래퍼 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Gradle 빌드 (테스트는 외부 인프라가 필요하므로 제외)
      - name: Build with Gradle
        run: ./gradlew build -x test
